name: Dependabot

on:
  pull_request:
    types: [labeled]

concurrency:
  group: dependabot-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read
jobs:
  build:
    if: github.event.label.name == 'bundler' && github.event.pull_request.user.login == 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        ruby-version:
          - "3.3"

    name: Appraisal - Ruby ${{ matrix.ruby-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: false
      - name: Set up Ruby ${{ matrix.ruby-version }}
        uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: true
      - name: Update Appraisal gemfiles
        run: |
          bundle exec appraisal update
      - name: Upload Appraisal lockfiles
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependabot-appraisal-lockfiles
          path: gemfiles/*.lock
          if-no-files-found: error
          retention-days: 1
